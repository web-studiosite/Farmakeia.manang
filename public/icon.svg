<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022030"/>
    </linearGradient>

    <!-- Subtle Radial Brand Glow behind Capsule -->
    <radialGradient id="pillGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1329" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Top Half Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Sky Blue Bottom Half Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Badge Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Background with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Brand Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#pillGlow)"/>

  <!-- Centered Rotated Capsule Pill -->
  <g transform="translate(256, 256) scale(8) translate(-24, -24)">
    <g transform="rotate(-45 24 24)">
      <!-- Capsule Body Top/Left Half (Emerald Green) -->
      <path d="M16 12C16 7.58172 19.5817 4 24 4C28.4183 4 32 7.58172 32 12V24H16V12Z" fill="url(#emeraldGrad)"/>
      
      <!-- Capsule Body Bottom/Right Half (Sky Blue) -->
      <path d="M16 24H32V36C32 40.4183 28.4183 44 24 44C19.5817 44 16 40.4183 16 36V24Z" fill="url(#skyGrad)"/>
      
      <!-- Waist Dividing Line -->
      <line x1="14" y1="24" x2="34" y2="24" stroke="#0B1329" stroke-width="2.5"/>
      
      <!-- Medical Capsule Shine / Highlights -->
      <path d="M20 9C20 7.8 21.2 6.5 23 6.5" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
      <path d="M20 28V34" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
    </g>
  </g>
</svg>
