<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FARMAKEIA — Pharmacy Management System</title>
    <meta name="description" content="Sistema profissional e completo de gestão de farmácia com controle de estoque FEFO, vendas, caixa, financeiro e Supabase." />
    <meta property="og:title" content="FARMAKEIA — Pharmacy Management System" />
    <meta property="og:description" content="Sistema profissional e completo de gestão de farmácia com controle de estoque FEFO, vendas, caixa, financeiro e Supabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FARMAKEIA" />
    <meta name="application-name" content="FARMAKEIA" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Brand Capsule Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Supabase JS Client (Global UMD fallback for zero-build static hosting) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- FARMAKEIA Stylesheet -->
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!-- Main Application Mounting Container -->
    <div id="app"></div>

    <!-- PWA In-App Install Prompt Banner -->
    <div id="pwa-install-banner" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; max-width: 360px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); color: #F8FAFC; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
        <img src="/pwa-192x192.png" alt="FARMAKEIA" width="38" height="38" style="border-radius: 8px; flex-shrink: 0;" />
        <div>
          <div style="font-weight: 700; font-size: 13.5px; color: #F8FAFC; line-height: 1.2;">Instalar FARMAKEIA</div>
          <div style="font-size: 11.5px; color: #94A3B8; margin-top: 2px;">Adicione à sua área de trabalho para acesso rápido e modo offline</div>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="pwa-dismiss-btn" type="button" style="background: transparent; border: 1px solid rgba(255, 255, 255, 0.15); color: #CBD5E1; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500;">Mais tarde</button>
        <button id="pwa-install-btn" type="button" style="background: linear-gradient(135deg, #10B981 0%, #0EA5E9 100%); border: none; color: #FFFFFF; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);">Instalar</button>
      </div>
    </div>

    <!-- PWA Service Worker & Installation Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[FARMAKEIA PWA] Service Worker ativo com escopo:', registration.scope);
            })
            .catch((error) => {
              console.warn('[FARMAKEIA PWA] Falha no registro do Service Worker:', error);
            });
        });
      }

      // In-App Install Prompt Controller
      (function() {
        let deferredPrompt = null;
        const banner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('pwa-install-btn');
        const dismissBtn = document.getElementById('pwa-dismiss-btn');

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          const dismissed = sessionStorage.getItem('pwa_prompt_dismissed');
          if (banner && !isStandalone && !dismissed) {
            banner.style.display = 'block';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            if (banner) banner.style.display = 'none';
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('[FARMAKEIA PWA] Opção escolhida:', outcome);
            deferredPrompt = null;
          });
        }

        if (dismissBtn) {
          dismissBtn.addEventListener('click', () => {
            if (banner) banner.style.display = 'none';
            sessionStorage.setItem('pwa_prompt_dismissed', 'true');
          });
        }

        window.addEventListener('appinstalled', () => {
          console.log('[FARMAKEIA PWA] App instalado com sucesso!');
          if (banner) banner.style.display = 'none';
          deferredPrompt = null;
        });
      })();
    </script>

    <!-- Application Vanilla JS Entry Point -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
